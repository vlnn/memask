<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      background: #16161e;
      color: #c8c8d0;
      height: 100vh;
      overflow: hidden;
      border-radius: 12px;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #drag-region {
      height: 6px;
      flex-shrink: 0;
      cursor: grab;
    }

    /* ── tabs ───────────────────────────────────────── */

    #tab-bar {
      display: flex;
      flex-shrink: 0;
      border-bottom: 1px solid #2a2a36;
      padding: 0 16px;
      gap: 0;
    }

    .tab {
      padding: 8px 14px;
      font-size: 13px;
      color: #5a5a6e;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .tab:hover { color: #9a9ab0; }
    .tab.active { color: #c8c8d0; border-bottom-color: #8b8bf5; }

    /* ── input view ─────────────────────────────────── */

    #input-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #input-view.hidden { display: none; }

    #input-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 10px;
      border-bottom: 1px solid #2a2a36;
      flex-shrink: 0;
    }

    #input-icon {
      font-size: 18px;
      color: #7a7a8c;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e8ee;
      font-size: 16px;
      font-family: inherit;
      caret-color: #8b8bf5;
    }

    #input::placeholder { color: #5a5a6e; }

    #spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid #3a3a4a;
      border-top-color: #8b8bf5;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    #spinner.active { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    #response {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a36 transparent;
    }

    #response:empty { display: none; }

    /* ── todo view ──────────────────────────────────── */

    #todo-view { display: none; flex-direction: column; flex: 1; min-height: 0; }
    #todo-view.active { display: flex; }

    #todo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #2a2a36;
      flex-shrink: 0;
    }

    #todo-count {
      font-size: 13px;
      color: #5a5a6e;
    }

    #todo-refresh {
      background: none;
      border: 1px solid #2a2a36;
      color: #7a7a8c;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }

    #todo-refresh:hover { color: #c8c8d0; border-color: #3a3a4a; }

    #todo-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      scrollbar-width: thin;
      scrollbar-color: #2a2a36 transparent;
    }

    .todo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #1e1e28;
      cursor: pointer;
      transition: background 0.1s;
    }

    .todo-row:hover { background: #1c1c26; }
    .todo-row:last-child { border-bottom: none; }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid #3a3a4a;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }

    .todo-row:hover .todo-checkbox { border-color: #8b8bf5; }

    .todo-checkbox.completing {
      border-color: #8bcc8b;
      background: #8bcc8b;
    }

    .todo-checkbox.completing::after {
      content: "✓";
      color: #16161e;
      font-size: 11px;
      font-weight: bold;
    }

    .todo-text {
      flex: 1;
      color: #d0d0d8;
      font-size: 14px;
      line-height: 1.4;
    }

    .todo-text.completing {
      color: #5a5a6e;
      text-decoration: line-through;
    }

    .todo-empty {
      padding: 32px 16px;
      text-align: center;
      color: #3e3e4e;
      font-size: 14px;
    }

    .todo-error {
      padding: 16px;
      color: #cc8b8b;
      font-size: 13px;
    }

    /* ── shared response styles ─────────────────────── */

    .msg { padding: 6px 0; line-height: 1.5; }

    .msg-success {
      color: #8bcc8b;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .msg-success .check { flex-shrink: 0; }

    .msg-error {
      color: #cc8b8b;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .msg-answer { color: #e0e0e8; }

    .sources {
      margin-top: 8px;
      font-size: 13px;
      color: #6a6a7e;
    }

    .sources span { color: #8b8bf5; }

    .result-list { list-style: none; }

    .result-item {
      padding: 8px 0;
      border-bottom: 1px solid #1e1e28;
    }

    .result-item:last-child { border-bottom: none; }

    .result-content { color: #d0d0d8; }

    .result-meta {
      font-size: 12px;
      color: #5a5a6e;
      margin-top: 2px;
    }

    .todo-item {
      padding: 6px 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .todo-bullet {
      color: #8b8bf5;
      flex-shrink: 0;
    }

    .todo-content { color: #d0d0d8; }

    .hint {
      font-size: 12px;
      color: #3e3e4e;
      padding: 8px 0;
    }

    /* ── status bar ─────────────────────────────────── */

    #status-bar {
      flex-shrink: 0;
      padding: 4px 16px;
      font-size: 11px;
      color: #3e3e4e;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #1e1e28;
    }

    #status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3e3e4e;
      margin-right: 4px;
      vertical-align: middle;
    }

    #status-dot.ok { background: #8bcc8b; }
    #status-dot.err { background: #cc8b8b; }
  </style>
</head>
<body>
  <div id="app">
    <div id="drag-region" data-tauri-drag-region></div>

    <div id="tab-bar">
      <div class="tab active" data-view="input">Input</div>
      <div class="tab" data-view="todos">Todos</div>
    </div>

    <div id="input-view">
      <div id="input-row">
        <div id="input-icon">›</div>
        <input id="input" type="text" placeholder="Type a thought, question, or command…" autofocus spellcheck="false">
        <div id="spinner"></div>
      </div>
      <div id="response"></div>
    </div>

    <div id="todo-view">
      <div id="todo-header">
        <span id="todo-count"></span>
        <button id="todo-refresh">refresh</button>
      </div>
      <div id="todo-list"></div>
    </div>

    <div id="status-bar">
      <span><span id="status-dot"></span><span id="status-text">starting…</span></span>
      <span>⌘⇧Space to toggle · Esc to hide</span>
    </div>
  </div>

  <script>
    const DAEMON = "http://127.0.0.1:7394";

    /* ── daemon api ─────────────────────────────────── */

    async function postInput(text) {
      const resp = await fetch(`${DAEMON}/input`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return resp.json();
    }

    async function fetchItems(type, status) {
      const params = new URLSearchParams();
      if (type) params.set("type", type);
      if (status) params.set("status", status);
      const resp = await fetch(`${DAEMON}/items?${params}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return resp.json();
    }

    async function fetchHealth() {
      const resp = await fetch(`${DAEMON}/health`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return resp.json();
    }

    /* ── tab switching ──────────────────────────────── */

    let activeView = "input";

    function switchView(view) {
      if (activeView === view) return;
      activeView = view;

      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.view === view);
      });

      const inputView = document.getElementById("input-view");
      const todoView = document.getElementById("todo-view");

      if (view === "input") {
        inputView.classList.remove("hidden");
        todoView.classList.remove("active");
        focusInput();
      } else {
        inputView.classList.add("hidden");
        todoView.classList.add("active");
        loadTodos();
      }
    }

    /* ── todo view ──────────────────────────────────── */

    async function loadTodos() {
      const list = document.getElementById("todo-list");
      const count = document.getElementById("todo-count");

      list.innerHTML = '<div class="todo-empty">Loading…</div>';
      count.textContent = "";

      try {
        const data = await fetchItems("todo", "pending");
        const items = data.items || [];
        count.textContent = items.length === 1 ? "1 todo" : `${items.length} todos`;
        renderTodoList(items);
      } catch (err) {
        count.textContent = "";
        list.innerHTML = `<div class="todo-error">Cannot load todos: ${esc(err.message)}</div>`;
      }
    }

    function renderTodoList(items) {
      const list = document.getElementById("todo-list");

      if (items.length === 0) {
        list.innerHTML = '<div class="todo-empty">No pending todos.</div>';
        return;
      }

      list.innerHTML = items.map(t =>
        `<div class="todo-row" data-id="${esc(t.id)}" data-content="${esc(t.content)}">
          <div class="todo-checkbox"></div>
          <div class="todo-text">${esc(t.content)}</div>
        </div>`
      ).join("");
    }

    async function completeTodo(row) {
      const content = row.dataset.content;
      const checkbox = row.querySelector(".todo-checkbox");
      const text = row.querySelector(".todo-text");

      checkbox.classList.add("completing");
      text.classList.add("completing");

      try {
        await postInput(`/todo done ${content}`);
        setTimeout(loadTodos, 300);
      } catch {
        checkbox.classList.remove("completing");
        text.classList.remove("completing");
      }
    }

    /* ── response renderers ─────────────────────────── */

    function renderCaptured(data) {
      return `<div class="msg msg-success">
        <span class="check">✓</span>
        <span>Captured: ${esc(data.content || "")}</span>
      </div>`;
    }

    function renderTodoCreated(data) {
      return `<div class="msg msg-success">
        <span class="check">✓</span>
        <span>Todo added: ${esc(data.content || "")}</span>
      </div>`;
    }

    function renderTodoCompleted(data) {
      return `<div class="msg msg-success">
        <span class="check">✓</span>
        <span>Done: ${esc(data.content || "")}</span>
      </div>`;
    }

    function renderTodoNotFound() {
      return `<div class="msg msg-error">
        <span>✗</span>
        <span>No matching todo found.</span>
      </div>`;
    }

    function renderTodoListed(data) {
      const items = data.items || [];
      if (items.length === 0) return `<div class="msg hint">No pending todos.</div>`;
      const lis = items.map(t =>
        `<div class="todo-item">
          <span class="todo-bullet">○</span>
          <span class="todo-content">${esc(t.content)}</span>
        </div>`
      ).join("");
      return `<div>${lis}</div>`;
    }

    function renderAnswered(data) {
      let html = `<div class="msg msg-answer">${esc(data.answer)}</div>`;
      const sources = data.sources || [];
      if (sources.length > 0) {
        html += `<div class="sources">Sources: ${sources.map(s => `<span>${esc(s)}</span>`).join(", ")}</div>`;
      }
      return html;
    }

    function renderSearched(data) {
      const results = data.results || [];
      if (results.length === 0) return `<div class="msg hint">No results found.</div>`;
      const lis = results.map(r =>
        `<div class="result-item">
          <div class="result-content">${esc(r.content)}</div>
          <div class="result-meta">${esc(r.type || "note")} · score ${(r.score || 0).toFixed(2)}</div>
        </div>`
      ).join("");
      return `<ul class="result-list">${lis}</ul>`;
    }

    function renderAppCommand(data) {
      return `<div class="msg hint">Command: ${esc(data.command || "unknown")}</div>`;
    }

    function renderError(message) {
      return `<div class="msg msg-error">
        <span>✗</span>
        <span>${esc(message)}</span>
      </div>`;
    }

    const RENDERERS = {
      captured: renderCaptured,
      todo_created: renderTodoCreated,
      todo_completed: renderTodoCompleted,
      todo_not_found: renderTodoNotFound,
      todo_listed: renderTodoListed,
      answered: renderAnswered,
      searched: renderSearched,
      app_command: renderAppCommand,
    };

    function renderResponse(result) {
      const renderer = RENDERERS[result.action];
      if (renderer) return renderer(result.data || {});
      return `<div class="msg hint">Done (${esc(result.action)})</div>`;
    }

    /* ── ui helpers ──────────────────────────────────── */

    function esc(text) {
      const d = document.createElement("div");
      d.textContent = String(text);
      return d.innerHTML;
    }

    function showSpinner() { document.getElementById("spinner").classList.add("active"); }
    function hideSpinner() { document.getElementById("spinner").classList.remove("active"); }

    function setResponse(html) {
      document.getElementById("response").innerHTML = html;
    }

    function clearResponse() { setResponse(""); }

    function focusInput() {
      const el = document.getElementById("input");
      el.focus();
      el.select();
    }

    /* ── status polling ─────────────────────────────── */

    function setStatus(ok, text) {
      const dot = document.getElementById("status-dot");
      const label = document.getElementById("status-text");
      dot.className = ok ? "ok" : "err";
      label.textContent = text;
    }

    async function pollHealth() {
      try {
        const h = await fetchHealth();
        const llm = h.llm?.available ? "LLM ready" : "no LLM";
        setStatus(true, `connected · ${llm}`);
      } catch {
        setStatus(false, "daemon offline");
      }
    }

    /* ── event handling ─────────────────────────────── */

    async function handleSubmit() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      clearResponse();
      showSpinner();

      try {
        const result = await postInput(text);
        setResponse(renderResponse(result));
      } catch (err) {
        const isDaemonDown = err.message.includes("fetch") || err.message.includes("network");
        const msg = isDaemonDown
          ? "Cannot reach daemon at " + DAEMON + ". Is it running?"
          : err.message;
        setResponse(renderError(msg));
      } finally {
        hideSpinner();
      }
    }

    async function hideWindow() {
      try {
        const { getCurrentWindow } = window.__TAURI__.window;
        await getCurrentWindow().hide();
      } catch (err) {
        console.error("hideWindow failed:", err);
      }
    }

    function handleKeydown(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        handleSubmit();
      }
      if (e.key === "Escape") {
        e.preventDefault();
        hideWindow();
      }
    }

    /* ── init ────────────────────────────────────────── */

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("input").addEventListener("keydown", handleKeydown);

      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => switchView(tab.dataset.view));
      });

      document.getElementById("todo-list").addEventListener("click", (e) => {
        const row = e.target.closest(".todo-row");
        if (row && !row.querySelector(".completing")) completeTodo(row);
      });

      document.getElementById("todo-refresh").addEventListener("click", loadTodos);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { e.preventDefault(); hideWindow(); }
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          if (activeView === "input") focusInput();
          if (activeView === "todos") loadTodos();
        }
      });

      pollHealth();
      setInterval(pollHealth, 15000);
    });
  </script>
</body>
</html>
