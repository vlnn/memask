[project]
name = "memask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vlnn", email = "vlnn-github@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "lancedb>=0.30.1",
    "sentence-transformers>=5.3.0",
    "ulid>=1.1",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.8",
]

[project.scripts]
memask = "memask.cli:cli"


[tool.pytest.ini_options]
testpaths = ["src/tests", "tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
