[project]
name = "memask"
version = "0.3.5"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "sentence-transformers>=3.0",
    "lancedb>=0.15",
    "pyarrow>=17.0",
    "llama-cpp-python>=0.3.19",
    "flask>=3.1.3",
]

[project.scripts]
memask = "memask.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memask"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["src/tests", "tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
